name: Build MMS APK

on:
  push:
    branches:
      - agent/build-mms-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install newest available numeric Android SDK
        run: |
          API=$(sdkmanager --list | grep -oE 'platforms;android-[0-9]+' | sed 's/.*-//' | sort -n | tail -1)
          test -n "$API"
          echo "CI Android API: $API"
          sdkmanager "platforms;android-$API"
          echo "CI_ANDROID_API=$API" >> "$GITHUB_ENV"

      - name: Reconstruct and verify MMS overlay
        run: |
          cat .build/mms-app.part-* | base64 -d > /tmp/mms-app-overlay.zip
          unzip -t /tmp/mms-app-overlay.zip
          rm -rf /tmp/mms-app-overlay
          mkdir -p /tmp/mms-app-overlay
          unzip -q /tmp/mms-app-overlay.zip -d /tmp/mms-app-overlay
          cp -a /tmp/mms-app-overlay/app/. app/
          sed -i -E "s/compileSdk = [0-9]+/compileSdk = ${CI_ANDROID_API}/; s/targetSdk = [0-9]+/targetSdk = ${CI_ANDROID_API}/" app/build.gradle.kts
          chmod +x gradlew
          cat app/build.gradle.kts

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMSfromCSV-v1.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
